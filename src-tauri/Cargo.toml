[package]
name = "ccm-reborn"
version = "0.3.0"
description = "A safe, cross-platform custom campaign manager for StarCraft II"
authors = ["CCM Reborn contributors"]
edition = "2021"
default-run = "ccm-reborn"

[lib]
name = "ccm_reborn_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fs2 = "0.4"
hex = "0.4"
mpq = "0.8.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Dev builds: optimize dependencies only. Unoptimized sha2/zip made hashing a
# 251 MB archive take ~18 s in `tauri dev` (0.9 s in release), which looked
# like a hang. Our own crate stays unoptimized, so rebuilds stay quick.
[profile.dev.package."*"]
opt-level = 3
